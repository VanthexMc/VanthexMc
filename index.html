<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VanthexMc</title>
    <script>
      // Se un file non si carica o il sito crasha all'avvio, mostra l'errore invece di una pagina bianca.
      (function () {
        function show(msg) {
          var root = document.getElementById("root");
          if (!root || root.childElementCount) return;
          var pre = document.createElement("pre");
          pre.style.cssText = "margin:0;min-height:100vh;padding:16px;background:#0F0A1A;color:#fff;font:13px monospace;white-space:pre-wrap";
          pre.textContent = "Errore di caricamento del sito:\n\n" + msg;
          root.appendChild(pre);
        }
        window.addEventListener("error", function (e) {
          var t = e.target;
          show(t && (t.src || t.href) ? "Impossibile caricare: " + (t.src || t.href) : e.message || "errore sconosciuto");
        }, true);
        window.addEventListener("unhandledrejection", function (e) {
          show(String((e.reason && (e.reason.stack || e.reason.message)) || e.reason));
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
